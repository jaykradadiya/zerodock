<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Z gradients -->
    <linearGradient id="za" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="zb" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Wordmark accent gradient -->
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Ambient glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Z shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ═══ Icon badge ═══ -->
  <rect x="2" y="2" width="76" height="76" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="76" height="76" rx="14" fill="none"
        stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
  <ellipse cx="40" cy="37" rx="30" ry="27" fill="url(#glow)"/>

  <!-- Z mark — scale to fit 48×48 centered in 80×80 badge -->
  <g transform="translate(40,40) scale(0.32) translate(-104.4,-223.5)" filter="url(#shadow)">
    <path d="M 46.971 197.453 L 73.322 193.017 L 88.716 169.837 L 153.761 179.257 L 114.574 253.956 L 87.364 255.023 L 106.081 223.731 L 93.846 225.293 C 89.159 233.998 74.456 262.706 75.656 262.823 L 120.682 262.108 L 179.354 162.967 L 81.288 152.254 L 46.971 197.453 Z" fill="url(#za)"/>
    <path d="M 111.773 247.118 L 101.632 245.751 L 119.328 211.295 L 98.387 211.246 L 58.946 273.849 C 58.946 273.849 69.004 273.944 147.506 269.312 L 139.54 283.27 L 29.376 294.763 L 92.832 199.56 L 133.108 201.449 L 111.773 247.118 Z" fill="url(#zb)"/>
  </g>

  <!-- ═══ Divider ═══ -->
  <line x1="92" y1="18" x2="92" y2="62" stroke="#1E293B" stroke-width="1" stroke-opacity="0.3"/>

  <!-- ═══ Wordmark ═══ -->
  <text x="106" y="49"
    font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-0.8"
    fill="#F1F5F9">Zero<tspan fill="url(#wm)">Dock</tspan></text>

  <!-- Tagline -->
  <text x="107" y="64"
    font-family="'Inter', -apple-system, system-ui, sans-serif"
    font-size="8.5"
    font-weight="500"
    letter-spacing="2.2"
    fill="#475569">PRIVACY-FIRST TOOLS</text>
</svg>
